<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>User Registry</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&family=IBM+Plex+Sans+KR:wght@300;400;500;600&display=swap" rel="stylesheet" />
  <style>
    /* ── Reset & Variables ─────────────────────────── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:        #0d1117;
      --surface:   #161b22;
      --border:    #21262d;
      --border-hi: #30363d;
      --accent:    #58a6ff;
      --accent-dim:#1f3f5e;
      --green:     #3fb950;
      --red:       #f85149;
      --text:      #e6edf3;
      --text-mute: #8b949e;
      --text-dim:  #484f58;
      --radius:    8px;
      --mono:      'IBM Plex Mono', monospace;
      --sans:      'IBM Plex Sans KR', sans-serif;
    }

    html { font-size: 14px; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: var(--sans);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* ── Header ───────────────────────────────────── */
    header {
      border-bottom: 1px solid var(--border);
      padding: 0 2rem;
      height: 56px;
      display: flex;
      align-items: center;
      position: sticky;
      top: 0;
      background: rgba(13,17,23,0.85);
      backdrop-filter: blur(12px);
      z-index: 100;
    }

    .logo {
      font-family: var(--mono);
      font-size: 1rem;
      font-weight: 600;
      color: var(--accent);
      letter-spacing: -0.02em;
    }

    /* ── Layout ───────────────────────────────────── */
    main {
      flex: 1;
      max-width: 1100px;
      width: 100%;
      margin: 0 auto;
      padding: 2rem 2rem 4rem;
      display: grid;
      grid-template-columns: 340px 1fr;
      gap: 1.5rem;
      align-items: start;
    }

    /* ── Cards ────────────────────────────────────── */
    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      overflow: hidden;
    }

    .card-header {
      padding: 1rem 1.25rem;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .card-title {
      font-size: 0.8rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--text-mute);
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .card-title::before {
      content: '';
      display: inline-block;
      width: 3px; height: 14px;
      background: var(--accent);
      border-radius: 2px;
    }

    .card-body { padding: 1.25rem; }

    /* ── Form ─────────────────────────────────────── */
    .field { margin-bottom: 1rem; }
    .field:last-of-type { margin-bottom: 1.25rem; }

    label {
      display: block;
      font-size: 0.75rem;
      font-weight: 500;
      color: var(--text-mute);
      margin-bottom: 6px;
      font-family: var(--mono);
      letter-spacing: 0.04em;
    }

    label .req {
      color: var(--red);
      margin-left: 3px;
    }

    input, select {
      width: 100%;
      background: var(--bg);
      border: 1px solid var(--border-hi);
      border-radius: var(--radius);
      padding: 9px 12px;
      color: var(--text);
      font-family: var(--mono);
      font-size: 0.85rem;
      transition: border-color 0.15s, box-shadow 0.15s;
      outline: none;
      -webkit-appearance: none;
    }

    input::placeholder { color: var(--text-dim); }

    input:focus, select:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(88,166,255,0.12);
    }

    select { cursor: pointer; }

    /* ── Button ───────────────────────────────────── */
    .btn {
      width: 100%;
      padding: 10px;
      border: none;
      border-radius: var(--radius);
      font-family: var(--mono);
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
      transition: opacity 0.15s, transform 0.1s;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      letter-spacing: 0.03em;
    }

    .btn:active { transform: scale(0.98); }

    .btn-primary {
      background: var(--accent);
      color: #0d1117;
    }

    .btn-primary:hover { opacity: 0.88; }
    .btn-primary:disabled { opacity: 0.4; cursor: not-allowed; }

    .btn-ghost {
      background: transparent;
      border: 1px solid var(--border-hi);
      color: var(--text-mute);
      padding: 6px 12px;
      width: auto;
      font-size: 0.75rem;
    }

    .btn-ghost:hover { border-color: var(--accent); color: var(--accent); }

    /* ── Toast ────────────────────────────────────── */
    .toast-wrap {
      position: fixed;
      bottom: 2rem;
      right: 2rem;
      display: flex;
      flex-direction: column;
      gap: 8px;
      z-index: 999;
      pointer-events: none;
    }

    .toast {
      font-family: var(--mono);
      font-size: 0.8rem;
      padding: 10px 16px;
      border-radius: var(--radius);
      border: 1px solid;
      background: var(--surface);
      opacity: 0;
      transform: translateY(12px);
      transition: all 0.25s cubic-bezier(.34,1.56,.64,1);
      max-width: 320px;
    }

    .toast.show { opacity: 1; transform: translateY(0); }

    .toast.success { border-color: var(--green); color: var(--green); }
    .toast.error   { border-color: var(--red);   color: var(--red); }
    .toast.info    { border-color: var(--accent); color: var(--accent); }

    /* ── User Table ───────────────────────────────── */
    .table-wrap { overflow-x: auto; }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.82rem;
    }

    thead tr { border-bottom: 1px solid var(--border); }

    th {
      padding: 10px 14px;
      text-align: left;
      font-family: var(--mono);
      font-size: 0.7rem;
      font-weight: 600;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--text-dim);
    }

    tbody tr {
      border-bottom: 1px solid var(--border);
      transition: background 0.1s;
    }

    tbody tr:last-child { border-bottom: none; }
    tbody tr:hover { background: rgba(88,166,255,0.04); }

    td { padding: 12px 14px; color: var(--text); }

    td.mono {
      font-family: var(--mono);
      font-size: 0.78rem;
      color: var(--text-mute);
    }

    .user-avatar {
      width: 28px; height: 28px;
      border-radius: 50%;
      background: var(--accent-dim);
      border: 1px solid var(--accent);
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: var(--mono);
      font-size: 0.7rem;
      font-weight: 600;
      color: var(--accent);
      flex-shrink: 0;
    }

    .user-name-cell {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .pill {
      display: inline-block;
      padding: 2px 8px;
      border-radius: 20px;
      font-family: var(--mono);
      font-size: 0.7rem;
      border: 1px solid var(--border-hi);
      color: var(--text-mute);
    }

    /* ── Empty / Loading state ────────────────────── */
    .empty-state {
      padding: 3rem 1.5rem;
      text-align: center;
    }

    .empty-icon {
      font-size: 2rem;
      margin-bottom: 0.75rem;
      opacity: 0.3;
    }

    .empty-state p {
      color: var(--text-dim);
      font-size: 0.82rem;
      font-family: var(--mono);
    }

    .loading-row td {
      padding: 2rem;
      text-align: center;
      color: var(--text-dim);
      font-family: var(--mono);
      font-size: 0.8rem;
    }

    /* ── Counter ──────────────────────────────────── */
    .count-badge {
      font-family: var(--mono);
      font-size: 0.7rem;
      background: var(--accent-dim);
      color: var(--accent);
      border: 1px solid rgba(88,166,255,0.25);
      border-radius: 20px;
      padding: 2px 8px;
    }

    /* ── Spinner ──────────────────────────────────── */
    @keyframes spin { to { transform: rotate(360deg); } }
    .spinner {
      width: 14px; height: 14px;
      border: 2px solid rgba(13,17,23,0.3);
      border-top-color: #0d1117;
      border-radius: 50%;
      animation: spin 0.6s linear infinite;
    }

    /* ── Responsive ───────────────────────────────── */
    @media (max-width: 768px) {
      main {
        grid-template-columns: 1fr;
        padding: 1.25rem 1rem 3rem;
      }
    }
  </style>
</head>
<body>

<!-- ── Header ──────────────────────────────── -->
<header>
  <span class="logo">User Registry</span>
</header>

<!-- ── Main ────────────────────────────────── -->
<main>

  <!-- 유저 등록 폼 -->
  <div class="card" style="position:sticky;top:80px;">
    <div class="card-header">
      <span class="card-title">유저 등록</span>
    </div>
    <div class="card-body">
      <div class="field">
        <label>이름<span class="req">*</span></label>
        <input type="text" id="fname" placeholder="홍길동" />
      </div>
      <div class="field">
        <label>이메일<span class="req">*</span></label>
        <input type="email" id="femail" placeholder="user@example.com" />
      </div>
      <div class="field">
        <label>부서</label>
        <select id="fdept">
          <option value="">— 선택 안함 —</option>
          <option value="Engineering">Engineering</option>
          <option value="Design">Design</option>
          <option value="Product">Product</option>
          <option value="Marketing">Marketing</option>
          <option value="Operations">Operations</option>
        </select>
      </div>
      <div class="field">
        <label>역할</label>
        <input type="text" id="frole" placeholder="ex) Backend Developer" />
      </div>
      <button class="btn btn-primary" id="submitBtn" onclick="createUser()">
        <span id="submitLabel">등록하기</span>
      </button>
    </div>
  </div>

  <!-- 유저 목록 -->
  <div class="card">
    <div class="card-header">
      <span class="card-title">유저 목록</span>
      <div style="display:flex;align-items:center;gap:8px;">
        <span class="count-badge" id="userCount">0명</span>
        <button class="btn btn-ghost" onclick="loadUsers()">↻ 새로고침</button>
      </div>
    </div>
    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th>이름</th>
            <th>이메일</th>
            <th>부서</th>
            <th>역할</th>
            <th>등록일시</th>
          </tr>
        </thead>
        <tbody id="userTableBody">
          <tr class="loading-row"><td colspan="5">데이터를 불러오는 중...</td></tr>
        </tbody>
      </table>
    </div>
  </div>

</main>

<!-- ── Toast Container ──────────────────────── -->
<div class="toast-wrap" id="toastWrap"></div>

<script>
  // ==========================================================
  // [필수 수정] EC2 백엔드 서버 주소를 아래에 입력하세요.
  //
  // 형식: "http://<EC2 퍼블릭 IP>:8000"
  // 예시: "http://3.34.12.56:8000"
  //
  // EC2 퍼블릭 IP는 AWS 콘솔 → EC2 → 인스턴스 목록에서 확인할 수 있습니다.
  // EC2 보안 그룹에서 8000번 포트(TCP) 인바운드가 열려 있어야 합니다.
  // ==========================================================
  const API_BASE_URL = "http://localhost:8000";
  // ==========================================================

  // ── 유저 목록 조회 (GET /users) ────────────────────────────
  async function loadUsers() {
    const tbody = document.getElementById('userTableBody');
    tbody.innerHTML = `<tr class="loading-row"><td colspan="5">불러오는 중...</td></tr>`;
    try {
      const res = await fetch(`${API_BASE_URL}/users`);
      if (!res.ok) throw new Error(`HTTP ${res.status}`);
      const users = await res.json();

      document.getElementById('userCount').textContent = `${users.length}명`;

      if (users.length === 0) {
        tbody.innerHTML = `
          <tr><td colspan="5">
            <div class="empty-state">
              <div class="empty-icon">◻</div>
              <p>등록된 유저가 없습니다.</p>
            </div>
          </td></tr>`;
        return;
      }

      tbody.innerHTML = users.map(u => `
        <tr>
          <td>
            <div class="user-name-cell">
              <div class="user-avatar">${getInitials(u.name)}</div>
              <span>${escHtml(u.name)}</span>
            </div>
          </td>
          <td class="mono">${escHtml(u.email)}</td>
          <td>${u.department
            ? `<span class="pill">${escHtml(u.department)}</span>`
            : '<span style="color:var(--text-dim)">—</span>'}</td>
          <td class="mono" style="font-size:0.75rem">${u.role
            ? escHtml(u.role)
            : '<span style="color:var(--text-dim)">—</span>'}</td>
          <td class="mono">${escHtml(u.created_at)}</td>
        </tr>`).join('');

    } catch {
      tbody.innerHTML = `
        <tr><td colspan="5">
          <div class="empty-state">
            <div class="empty-icon">⚠</div>
            <p>API 연결에 실패했습니다.</p>
          </div>
        </td></tr>`;
    }
  }

  // ── 유저 등록 (POST /users) ────────────────────────────────
  async function createUser() {
    const name  = document.getElementById('fname').value.trim();
    const email = document.getElementById('femail').value.trim();
    const dept  = document.getElementById('fdept').value;
    const role  = document.getElementById('frole').value.trim();

    if (!name)  return showToast('이름을 입력하세요.', 'error');
    if (!email) return showToast('이메일을 입력하세요.', 'error');
    if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email))
      return showToast('올바른 이메일 형식이 아닙니다.', 'error');

    const btn   = document.getElementById('submitBtn');
    const label = document.getElementById('submitLabel');
    btn.disabled = true;
    label.innerHTML = '<span class="spinner"></span>';

    try {
      const res = await fetch(`${API_BASE_URL}/users`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          name,
          email,
          department: dept || null,
          role: role || null,
        }),
      });

      const data = await res.json();

      if (res.ok) {
        showToast(`✓ ${name}님이 등록되었습니다.`, 'success');
        ['fname', 'femail', 'frole'].forEach(id => document.getElementById(id).value = '');
        document.getElementById('fdept').value = '';
        loadUsers();
      } else {
        showToast(data.detail || '등록에 실패했습니다.', 'error');
      }
    } catch {
      showToast('서버에 연결할 수 없습니다.', 'error');
    } finally {
      btn.disabled = false;
      label.textContent = '등록하기';
    }
  }

  // ── 헬퍼 ──────────────────────────────────────────────────
  function showToast(msg, type = 'info', duration = 3000) {
    const wrap = document.getElementById('toastWrap');
    const el = document.createElement('div');
    el.className = `toast ${type}`;
    el.textContent = msg;
    wrap.appendChild(el);
    requestAnimationFrame(() => {
      requestAnimationFrame(() => el.classList.add('show'));
    });
    setTimeout(() => {
      el.classList.remove('show');
      setTimeout(() => el.remove(), 300);
    }, duration);
  }

  function getInitials(name) {
    if (!name) return '?';
    const parts = name.trim().split(/\s+/);
    return parts.length >= 2
      ? (parts[0][0] + parts[1][0]).toUpperCase()
      : name.slice(0, 2).toUpperCase();
  }

  function escHtml(str) {
    return String(str ?? '')
      .replace(/&/g, '&amp;').replace(/</g, '&lt;')
      .replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  }

  // Enter 키로 등록 제출
  document.addEventListener('keydown', e => {
    if (e.key === 'Enter' && ['fname', 'femail', 'frole'].includes(e.target.id)) {
      createUser();
    }
  });

  // ── 초기 로드 ─────────────────────────────────────────────
  loadUsers();
</script>
</body>
</html>
